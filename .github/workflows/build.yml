name: Build & Push

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# Deploy is PULL-BASED: this only builds and pushes the image. Flux
# image-automation on the cluster (homelab-k3s, clusters/tunis/services/<app>)
# scans GHCR, selects the newest `main-<ts>-<sha>` tag, rewrites the image
# marker in deployment.yaml, commits it back, and rolls the pod. See
# .claude/skills/deploy-fastapi-to-homelab-k8s and deploy/README.md.
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Sortable tag for the Flux ImagePolicy (numeric sort on the timestamp).
      - name: Compute image tag
        id: meta
        run: echo "tag=main-$(date +%s)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push single-container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VITE_API_URL=
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
