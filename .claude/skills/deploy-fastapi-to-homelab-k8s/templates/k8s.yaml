# Homelab (tunis) manifests for a single-container FastAPI+SPA app with CNPG Postgres.
# Copy to clusters/tunis/services/APPNAME/ (split into files or keep as one), then:
#   - replace APPNAME everywhere
#   - set real hostnames + non-`changethis` SECRET_KEY / passwords
#   - keep POSTGRES_PASSWORD identical in the two Secrets
#   - add `- APPNAME` to clusters/tunis/services/kustomization.yaml
# Spans two namespaces (APPNAME + databases) => the kustomization.yaml must NOT set a
# top-level `namespace:` transformer; every resource names its own namespace.
---
apiVersion: v1
kind: Namespace
metadata:
  name: APPNAME
---
apiVersion: v1
kind: Secret
metadata:
  name: APPNAME-app
  namespace: APPNAME
type: Opaque
stringData:
  SECRET_KEY: "CHANGE-ME-secret"
  FIRST_SUPERUSER_PASSWORD: "CHANGE-ME-admin"
  POSTGRES_PASSWORD: "CHANGE-ME-pg"   # must equal the CNPG bootstrap secret below
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: APPNAME-pg
  namespace: databases
spec:
  description: "Postgres for APPNAME"
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:17.4
  primaryUpdateStrategy: unsupervised
  resources:
    requests: { memory: "256Mi", cpu: "100m" }
    limits:   { memory: "1Gi",   cpu: "500m" }
  storage:
    size: 5Gi
  bootstrap:
    initdb:
      database: APPNAME
      owner: app
      secret:
        name: APPNAME-pg-app
---
apiVersion: v1
kind: Secret
metadata:
  name: APPNAME-pg-app
  namespace: databases
stringData:
  username: app
  password: "CHANGE-ME-pg"            # keep in sync with POSTGRES_PASSWORD above
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: APPNAME
  namespace: APPNAME
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: APPNAME
  template:
    metadata:
      labels:
        app: APPNAME
    spec:
      # If the ghcr package is PUBLIC: drop imagePullSecrets and use
      #   image: 10.43.205.186:5000/aabichou/APPNAME:latest   (Zot mirror, the convention)
      # If PRIVATE: create the pull secret (see the skill) and keep this block.
      imagePullSecrets:
        - name: ghcr-APPNAME
      containers:
        - name: APPNAME
          image: ghcr.io/aabichou/APPNAME:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          env:
            - { name: ENVIRONMENT, value: "staging" }
            - { name: PROJECT_NAME, value: "APPNAME" }
            - { name: FIRST_SUPERUSER, value: "admin@APPNAME.tn" }
            - { name: BACKEND_CORS_ORIGINS, value: "https://APPNAME.ts.k8s.cloud.abichou.tn,https://APPNAME.external.k8s.cloud.abichou.tn" }
            - { name: FRONTEND_HOST, value: "https://APPNAME.ts.k8s.cloud.abichou.tn" }
            - { name: POSTGRES_SERVER, value: "APPNAME-pg-rw.databases" }
            - { name: POSTGRES_PORT, value: "5432" }
            - { name: POSTGRES_DB, value: "APPNAME" }
            - { name: POSTGRES_USER, value: "app" }
            - { name: SECRET_KEY,              valueFrom: { secretKeyRef: { name: APPNAME-app, key: SECRET_KEY } } }
            - { name: FIRST_SUPERUSER_PASSWORD, valueFrom: { secretKeyRef: { name: APPNAME-app, key: FIRST_SUPERUSER_PASSWORD } } }
            - { name: POSTGRES_PASSWORD,       valueFrom: { secretKeyRef: { name: APPNAME-app, key: POSTGRES_PASSWORD } } }
          readinessProbe:
            httpGet: { path: /api/v1/utils/health-check/, port: 8000 }
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /api/v1/utils/health-check/, port: 8000 }
            initialDelaySeconds: 90
            periodSeconds: 20
          resources:
            requests: { memory: "512Mi", cpu: "250m" }
            limits:   { memory: "1Gi",   cpu: "1" }
---
apiVersion: v1
kind: Service
metadata:
  name: APPNAME
  namespace: APPNAME
spec:
  selector:
    app: APPNAME
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: APPNAME
  namespace: APPNAME
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`APPNAME.ts.k8s.cloud.abichou.tn`) || Host(`APPNAME.external.k8s.cloud.abichou.tn`)
      services:
        - name: APPNAME
          port: 8000
  tls: {}
